spec_version: soyapack.v0
kind: Agent
name: essay-tutor
version: 0.1.0-alpha.0
description: |
  Compo — turns a parent's photo / scan / text of an essay sample plus a writing
  title into a printable PDF/HTML writing guide for grade-school students.
authors:
  - name: SoyaOS Contributors
    email: hello@soyaos.ai
license: MIT
homepage: https://github.com/soyaos/example-essay-tutor
runtime:
  compat: ">=0.1.0 <0.2.0"
determinism: read-only
affinity: any

expose:
  openai_compat: both
  virtual_model_id: soya:compo

inputs:
  - name: title
    type: string
    optional: true
  - name: sample
    type: array
    optional: true   # accepts uploaded image/PDF/text via tool.parse_input
  - name: parent_hint
    type: string
    optional: true

# 3-step prompt chain (APP-550 Phase B):
#
#   analyze  → 解析范文（题材 / 年级 / 亮点）
#   generate → 生成完整写作指南（结构 / 范例 / 提示）
#   refine   → 按年级口吻润色 + 体例对齐
#
# Each stage's full response is fed as the user input of the next; only
# the final stage's stream is returned to the caller. This is what
# lifts the output quality above the single-prompt baseline.
prompt:
  scaffold: minimal-input-high-quality
  tools: [tool.parse_input]
  steps:
    - { id: analyze,  prompt: prompts/analyze_sample.md }
    - { id: generate, prompt: prompts/generate_guide.md }
    - { id: refine,   prompt: prompts/refine_for_grade.md }

artifacts:
  - kind: html
    schema: guide.v1
  - kind: pdf
    schema: guide.v1

sandbox:
  isolation: container
  image: html-base@0.1.0
  budget_seconds_max: 30
  cold_start_target_ms: 3000
  capabilities:
    network_out:
      - host: api.openai.com
        port: 443
        proto: https
    fs_read:
      - /workdir
    fs_write:
      - /workdir/out
    determinism_tier: read-only
